steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}
      - --build-arg
      - VITE_APP_VERSION=$COMMIT_SHA
      - --tag
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _GOOGLE_CLIENT_ID: ""
  _IMAGE: europe-west2-docker.pkg.dev/$PROJECT_ID/lockin/app:latest
options:
  logging: CLOUD_LOGGING_ONLY
