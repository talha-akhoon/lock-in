<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LockIn" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="LockIn — commit to six months of measurable goals with a team that holds you to them."
    />
    <title>LockIn</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100dvh;
        background: #0b0d0c;
        color: #ecf0eb;
      }
      .boot-screen {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-screen .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -.04em;
      }
      .boot-screen .brand span {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid #536349;
        color: #c8f560;
        border-radius: 9px;
        font-size: 11px;
        letter-spacing: .04em;
      }
      .boot-dots { display: flex; gap: 7px; }
      .boot-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #c8f560;
        animation: boot-pulse 1s infinite alternate;
      }
      .boot-dots span:nth-child(2) { animation-delay: .2s; }
      .boot-dots span:nth-child(3) { animation-delay: .4s; }
      @keyframes boot-pulse { to { opacity: .2; transform: translateY(-6px); } }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="brand"><span>LI</span> LockIn</div>
        <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <span class="sr-only">Loading LockIn</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
