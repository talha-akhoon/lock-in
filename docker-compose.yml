services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lockin
      POSTGRES_USER: lockin
      POSTGRES_PASSWORD: lockin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockin"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5432 is often already taken by a local Postgres install.
      - "5433:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://lockin:lockin@postgres:5432/lockin
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CHALLENGE_TIMEZONE: ${CHALLENGE_TIMEZONE:-Europe/London}
      SECURE_COOKIES: "false"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  frontend_node_modules:
