name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lockin_test
          POSTGRES_USER: lockin
          POSTGRES_PASSWORD: lockin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockin"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg://lockin:lockin@127.0.0.1:5432/lockin_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Migrations match the models
        run: uv run alembic upgrade head && uv run alembic check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lockin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image serves the SPA and the API from one origin
        run: |
          set -euo pipefail
          docker run -d --name lockin -p 8080:8080 \
            -e DATABASE_URL=postgresql+psycopg://unused:unused@127.0.0.1:5432/unused \
            -e SECRET_KEY=ci-only-secret-key-not-used-anywhere-real \
            --entrypoint sh lockin:ci \
            -c 'exec uvicorn app.main:app --host 0.0.0.0 --port 8080'

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          status() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1"; }
          expect() {
            got=$(status "$1")
            if [ "$got" != "$2" ]; then
              echo "$1 returned $got, expected $2" >&2
              exit 1
            fi
          }

          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/dashboard | grep -q 'id="root"'

          # Client-side routes get the app shell; anything else must say no.
          expect /goals/some-id 200
          expect /api/v1/nope 404
          expect /docs 404
          expect /redoc 404
          expect /openapi.json 404

          test "$(docker exec lockin id -u)" = "10001"

      - name: Container logs on failure
        if: failure()
        run: docker logs lockin || true
