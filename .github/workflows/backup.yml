name: Weekly database backup

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        # Must match the server's major version, otherwise pg_dump refuses to run.
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump and encrypt database
        env:
          # BACKUP_DATABASE_URL is the plain libpq URL, not the app's
          # postgresql+psycopg:// form — pg_dump rejects the SQLAlchemy driver
          # suffix outright. Neon also requires ?sslmode=require.
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_DATABASE_URL}" ]; then
            echo "BACKUP_DATABASE_URL is not set" >&2
            exit 1
          fi
          case "${BACKUP_DATABASE_URL}" in
            postgresql+*|postgres+*)
              echo "BACKUP_DATABASE_URL still carries a driver suffix (postgresql+psycopg://)." >&2
              echo "Store the plain postgresql:// URL instead." >&2
              exit 1
              ;;
          esac

          file="lockin-$(date -u +%Y-%m-%d).sql.gz.enc"
          pg_dump "${BACKUP_DATABASE_URL}" --no-owner --no-acl \
            | gzip \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 \
                -pass env:BACKUP_ENCRYPTION_KEY \
            > "${file}"

          # An empty or trivially small dump means the pipe failed somewhere.
          size=$(wc -c < "${file}")
          echo "Wrote ${file} (${size} bytes)"
          if [ "${size}" -lt 1024 ]; then
            echo "Backup is implausibly small — treating as a failure." >&2
            exit 1
          fi

      - name: Verify the archive decrypts
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          # A backup nobody can open is not a backup.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -pass env:BACKUP_ENCRYPTION_KEY -in ./*.sql.gz.enc \
            | gunzip \
            | head -n 40 \
            | grep -q "PostgreSQL database dump"
          echo "Archive decrypts and contains a dump header."

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: lockin-backup-${{ github.run_id }}
          path: "*.sql.gz.enc"
          retention-days: 90
