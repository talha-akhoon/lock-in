name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: lockin-505614
  GCP_REGION: europe-west2
  IMAGE: europe-west2-docker.pkg.dev/lockin-505614/lockin/app
  CLOUD_RUN_SERVICE: lockin
  CLOUD_RUN_SA: lockin-run@lockin-505614.iam.gserviceaccount.com
  GOOGLE_CLIENT_ID: 979991728317-elnbbha9d3vim07vfvf7uvks89qrr23k.apps.googleusercontent.com

jobs:
  cloud-run:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/979991728317/locations/global/workloadIdentityPools/github/providers/github
          service_account: lockin-github@lockin-505614.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT}" \
            --image "${IMAGE}:${{ github.event.workflow_run.head_sha || github.sha }}" \
            --region "${GCP_REGION}" \
            --service-account "${CLOUD_RUN_SA}" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --set-env-vars "ENVIRONMENT=production,SECURE_COOKIES=true,FRONTEND_DIST=/frontend/dist,CHALLENGE_TIMEZONE=Europe/London" \
            --set-secrets "DATABASE_URL=lockin-database-url:latest,SECRET_KEY=lockin-secret-key:latest,GOOGLE_CLIENT_ID=lockin-google-client-id:latest"

  cloudflare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare
          command: deploy

      - name: Skip Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping the Worker deploy."
